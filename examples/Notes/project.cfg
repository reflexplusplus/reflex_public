include: "$[get_reflex_path:]/project_configs/cpp_app.cfg";

name: "Notes";

@Target App:
{
	inherit: cpp_app;

	@Variables:
	{
		VENDOR_NAME: "Reflex++";
		PRODUCT_NAME: "Notes";
		PRODUCT_VERSION: "1.0.0";
	};

	@Files sources:
	{
		'':
		"$(REFLEX_PATH)/src/reflex_ext.cpp";

		code:
		"code/resources.cpp",
		"code/entry.cpp",
		"code/app.cpp",
		"code/view.cpp";
	};

	@Files headers:
	{
		code: "code/**/*.h";
	};

	@Files other:
	{
		'':
		"resources.xml";

		resources:
		"resources/**/*";
	};

	@ios: { enabled: false; };
	@android: { enabled: false; };
};
