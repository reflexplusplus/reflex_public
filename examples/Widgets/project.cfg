// This project was bootstrapped with `reflex create`.
// Regenerate native projects with `reflex generate --path "project.cfg"`.

include: "$[get_reflex_path:]/project_configs/cpp_app.cfg";

name: "Widgets";

@Target App:
{
	inherit: cpp_app;

	@Variables:
	{
		VENDOR_NAME: "Reflex++";
		PRODUCT_NAME: "Widgets";
		PRODUCT_VERSION: "1.0.0";
		PRODUCT_PACKAGE_IDENTIFIER: "com.reflex.widgets";
	};

	@Files sources:
	{
		'': "$(REFLEX_PATH)/src/reflex_ext.cpp";
		code: 
		"code/resources.cpp", 
		"code/entry.cpp", 
		"code/app.cpp", 
		"code/view.cpp", 
		"code/widgets/button.cpp", 
		"code/widgets/rotary_slider.cpp", 
		"code/widgets/dragedit.cpp", 
		"code/widgets/rangebar.cpp", 
		"code/widgets/zone.cpp", 
		"code/widgets/popup.cpp";
	};

	@Files headers: { code: "code/**/*.h"; };
	@Files other: { '': "resources.xml"; resources: "resources/**/*"; };
	@linux: { enabled: false; };
};
