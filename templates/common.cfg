input:
{
	strings:
	[
		{ id: "vendor"; token: "VENDOR-NAME"; name: "Vendor Name"; },
		{ id: "product"; token: "PRODUCT-NAME"; name: "Product Name"; }
	];
};

generate:
{
	paths:
	{
		'REFLEX-PATH': "$[get_reflex_path:]";
	};

	strings:
	{
		'PRODUCT-NAME-SYMBOL': "$[strip:_PRODUCT-NAME_]";
		'PACKAGE-ID-VENDOR': "$[package_identifier_segment:_VENDOR-NAME_]";
		'PACKAGE-ID-PRODUCT': "$[package_identifier_segment:_PRODUCT-NAME_]";
		'VENDOR-4CC': "$[generate_4cc:_VENDOR-NAME_]";
		'PRODUCT-4CC': "$[generate_4cc:_PRODUCT-NAME_]";
		'RESOURCES-H': "resources.h";
		'RESOURCES-CPP': "resources.cpp";
	};
};

exclude:
{
	folders: [".git/", "Debug/", "Release/", ".vs/", "[old]/"];
	files: ["install.cfg", ".DS_Store", "_PRODUCT-NAME_.xcodeproj.zip", "_PRODUCT-NAME_.zip"];
};

replace:
{
	types: ["cpp", "h", "c", "txt", "md", "glx", "cmake", "xml", "cfg", "sln", "bat", "command", "RENAME"];

	vars:
	[
		"REFLEX-PATH",
		"VENDOR-NAME",
		"PRODUCT-NAME",

		"PRODUCT-NAME-SYMBOL",
		"PACKAGE-ID-VENDOR",
		"PACKAGE-ID-PRODUCT",
		"VENDOR-4CC",
		"PRODUCT-4CC"
	];
};
