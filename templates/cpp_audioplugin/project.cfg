// This project was created using `reflex create`.
// To apply modifications, regenerate with `reflex generate --path "path/to/project.cfg"`.

@Variables: { REFLEX_PATH: "$[get_reflex_path:]"; };		// Automatically locate the SDK; override with reflex set REFLEX_PATH "/custom/path/reflex"

include: "$(REFLEX_PATH)/project_configs/cpp_audioplugin.cfg";

name: "_PRODUCT-NAME_";
default_configuration: Release;

@Template product:
{
	@Variables:
	{
		VENDOR_NAME: "_VENDOR-NAME_";
		PRODUCT_NAME: "_PRODUCT-NAME_";
		PRODUCT_VERSION: "1.0.0";
		AU_VENDOR_4CC: "_VENDOR-4CC_";
		AU_COMPONENTS: "_PRODUCT-4CC_:aufx";
		PRODUCT_PACKAGE_IDENTIFIER: "com._PACKAGE-ID-VENDOR_._PACKAGE-ID-PRODUCT_";
	};

	@Files sources:
	{
		'': "$(REFLEX_PATH)/src/reflex_ext.cpp";
		code: 
		"code/resources.cpp", 
		"code/entry.cpp", 
		"code/instance.cpp", 
		"code/view.cpp";
	};

	@Files headers:
	{
		code: "code/**/*.h";
	};

	@Files other:
	{
		'': "resources.xml";
		resources: "resources/**/*";
	};
};

@Target Standalone: { inherit: cpp_audioplugin_app, product; };
@Target CLAP: { inherit: cpp_audioplugin_clap, product; };
@Target VST3: { inherit: cpp_audioplugin_vst3, product; };
@Target AudioUnit: { inherit: cpp_audioplugin_audiounit, product; };
