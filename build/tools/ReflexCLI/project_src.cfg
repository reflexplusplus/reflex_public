// Source-bootstrap variant of project.cfg. It retains the ReflexCLI product
// definition while replacing its prebuilt Reflex dependencies with sources.

include: "project_common.cfg";

name: "ReflexCLI";
default_configuration: Release;

@Target ReflexCLI:
{
	inherit: reflex_cli_product;
	@Unset dependencies;

	// ReflexCLI cannot acquire its own package while bootstrapping. Load only
	// the low-level generated-build operations from the source checkout.
	@Unset cmake_find_packages;
	@Variables cmake_variables:
	{
		REFLEX_ROOT: "$(REFLEX_PATH)";
	};
	cmake_includes: "$(REFLEX_PATH)/cmake/ReflexBuild.cmake";

	@Files sources:
	{
		reflex_core:
		[
			"$(REFLEX_PATH)/src/reflex/core.cpp",
			"$(REFLEX_PATH)/src/reflex/data.cpp",
			"$(REFLEX_PATH)/src/reflex/file.cpp",
			"$(REFLEX_PATH)/src/reflex/vec.cpp"
		];
		reflex_platform: "$(REFLEX_PLATFORM_SOURCE)";
	};

	@windows:
	{
		@Variables: { REFLEX_PLATFORM_SOURCE: "$(REFLEX_PATH)/src/reflex/system/win_console.cpp"; };
	};

	@macos:
	{
		@Variables: { REFLEX_PLATFORM_SOURCE: "$(REFLEX_PATH)/src/reflex/system/macos_console.mm"; };
	};

	@linux:
	{
		@Variables: { REFLEX_PLATFORM_SOURCE: "$(REFLEX_PATH)/src/reflex/system/linux_console.cpp"; };
	};
};
