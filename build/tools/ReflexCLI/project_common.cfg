include: "../../../project_configs/cpp_console_app.cfg";

@Library curl:
{
	inherit: reflex_common;
	@windows: { enabled: false; };
	@macos: { enabled: false; };
	@ios: { enabled: false; };
	@android: { enabled: false; };
};

@Library dl:
{
	inherit: reflex_common;
	@windows: { enabled: false; };
	@macos: { enabled: false; };
	@ios: { enabled: false; };
	@android: { enabled: false; };
};

@Library m:
{
	inherit: reflex_common;
	@windows: { enabled: false; };
	@macos: { enabled: false; };
	@ios: { enabled: false; };
	@android: { enabled: false; };
};

@Library pthread:
{
	inherit: reflex_common;
	@windows: { enabled: false; };
	@macos: { enabled: false; };
	@ios: { enabled: false; };
	@android: { enabled: false; };
};

@Template reflex_cli_product:
{
	inherit: cpp_console_app;

	output_name: "reflex";
	@Unset pre_build;

	@Variables:
	{
		REFLEX_PATH: "../../..";
		PRODUCT_NAME: "ReflexCLI";
		PRODUCT_PACKAGE_IDENTIFIER: "com.reflexplusplus.$[package_identifier_segment:$(PRODUCT_NAME)]";
	};

	@Files sources:
	{
		reflex: "$(REFLEX_PATH)/src/reflex_ext.cpp";
		doc: ["code/doc.cpp", "code/documentation.cpp"];
		install: "code/install.cpp";
		create: "code/project_creator.cpp";
		assets: ["code/plist_builder.cpp", "code/resource_builder.cpp"];
		generate:
		[
			"code/project_gen.cpp",
			"code/project_gen_schema.cpp",
			"code/project_gen_emitter.cpp",
			"code/project_gen_android.cpp",
			"code/project_gen_cmake.cpp",
			"code/project_gen_vscode.cpp",
			"code/project_gen_linux.cpp",
			"code/project_gen_web.cpp",
			"code/project_gen_xcode.cpp",
			"code/project_gen_visual_studio.cpp"
		];
		build: "code/build.cpp";
		'': ["code/common.cpp", "code/tasks.cpp", "code/entry.cpp", "code/resources.cpp"];
	};
	@windows:
	{
		@BuildStep post_build:
		[
			{
				name: "Create install directory";
				command: ["cmake", "-E", "make_directory", "$(REFLEX_PATH)/bin/tools/win"];
			},
			{
				name: "Install";
				inputs: "output/$(Platform)/$(Configuration)/$(Architecture)/$(TargetName)/$(OutputName).exe";
				command:
				[
					"xcopy", "/y",
					"$[quote:$[path:output/$(Platform)/$(Configuration)/$(Architecture)/$(TargetName)/$(OutputName).exe]]",
					"$[quote:$[path:$(REFLEX_PATH)/bin/tools/win]]"
				];
			}
		];
	};

	@macos:
	{
		code_sign: false;

		@BuildStep post_build:
		[
			{
				name: "Codesign";
				inputs: "output/$(Platform)/$(Configuration)/$(TargetName)/$(OutputName)";
				command: ["codesign", "--force", "--sign", "-", "output/$(Platform)/$(Configuration)/$(TargetName)/$(OutputName)"];
			},
			{
				name: "Create install directory";
				command: ["mkdir", "-p", "$(REFLEX_PATH)/bin/tools/macos"];
			},
			{
				name: "Install";
				inputs: "output/$(Platform)/$(Configuration)/$(TargetName)/$(OutputName)";
				command: ["cp", "-f", "output/$(Platform)/$(Configuration)/$(TargetName)/$(OutputName)", "$(REFLEX_PATH)/bin/tools/macos/$(OutputName)"];
			}
		];
	};

	@linux:
	{
		dependencies: [curl, dl, m, pthread];

		@BuildStep post_build:
		[
			{
				name: "Create install directory";
				command: ["mkdir", "-p", "$(REFLEX_PATH)/bin/tools/linux"];
			},
			{
				name: "Install";
				inputs: "output/$(Platform)/$(Configuration)/$(Architecture)/$(TargetName)/$(OutputName)";
				command: ["cp", "-f", "output/$(Platform)/$(Configuration)/$(Architecture)/$(TargetName)/$(OutputName)", "$(REFLEX_PATH)/bin/tools/linux/$(OutputName)"];
			}
		];
	};
};
