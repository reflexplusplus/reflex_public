include: "../../../project_configs/cpp_app.cfg";

name: "Reflex Project Creator";

@Target App:
{
	inherit: cpp_app;

	@Variables:
	{
		REFLEX_PATH: "../../..";
		VENDOR_NAME: "Reflex++";
		PRODUCT_NAME: "Reflex Project Creator";
		PRODUCT_VERSION: "1.0.0";
		PRODUCT_PACKAGE_IDENTIFIER: "com.reflexplusplus.$[package_identifier_segment:$(PRODUCT_NAME)]";
		APPLE_DEVELOPMENT_TEAM: "";
		APPLE_SIGN_IDENTITY: "-";
	};

	@Files sources:
	{
		'':
		[
			"code/app.cpp", "code/entry.cpp", "code/resources.cpp", "code/view.cpp",
			"../ReflexCLI/code/common.cpp", "$(REFLEX_PATH)/src/reflex_ext.cpp"
		];
	};

	@windows:
	{
		@BuildStep post_build:
		{
			name: "Install";
			inputs: "output/$(Platform)/$(Configuration)/$(Architecture)/$(OutputName)/$(OutputName).exe";
			command:
			[
				"xcopy", "/y",
				"$[quote:$[path:output/$(Platform)/$(Configuration)/$(Architecture)/$(OutputName)/$(OutputName).exe]]",
				"$[quote:$[path:$(REFLEX_PATH)/bin/tools/win]]"
			];
		};
	};

	@macos:
	{
		code_sign: false;

		@Configuration Release:
		{
			// Local builds use ad-hoc signing; distribution notarization belongs in CI.
			@BuildStep post_build:
			[
				{
					name: "Codesign";
					inputs: "output/$(Platform)/$(Configuration)/$(OutputName)/$(OutputName).app";
					command: ["codesign", "--deep", "--force", "--options", "runtime", "--entitlements", "platform_assets/macos/HardenedRT.entitlements", "--sign", "$(APPLE_SIGN_IDENTITY)", "output/$(Platform)/$(Configuration)/$(OutputName)/$(OutputName).app"];
				},
				{
					name: "Verify signature";
					inputs: "output/$(Platform)/$(Configuration)/$(OutputName)/$(OutputName).app";
					command: ["codesign", "--verify", "--verbose=4", "output/$(Platform)/$(Configuration)/$(OutputName)/$(OutputName).app"];
				},
				{ command: ["mkdir", "-p", "$(REFLEX_PATH)/bin/tools/macos"]; },
				{ command: ["rm", "-rf", "$(REFLEX_PATH)/bin/tools/macos/$(OutputName).app"]; },
				{
					name: "Install";
					inputs: "output/$(Platform)/$(Configuration)/$(OutputName)/$(OutputName).app";
					command: ["ditto", "output/$(Platform)/$(Configuration)/$(OutputName)/$(OutputName).app", "$(REFLEX_PATH)/bin/tools/macos/$(OutputName).app"];
				}
			];
		};
	};

	@linux: { enabled: true; };
	@ios: { enabled: false; };
	@android: { enabled: false; };
	@web: { enabled: false; };
};
