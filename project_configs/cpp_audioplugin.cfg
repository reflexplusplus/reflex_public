		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VTask.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VTransport.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VViewContainer.cpp";
	};

	@windows:
	{
		output_directory: "$(OUTPUT_PATH)/windows/$(Configuration)/$(Architecture)/$(OutputName)/$(OutputName).aaxplugin/Contents/x64";
	};

	@macos:
	{
		bundle_identifier: "$(PLUGIN_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/aax.plist";
		exported_symbols: "$(REFLEX_PATH)/resources/macos/aax_exports.txt";
		@BuildStep post_generate:
		{
			name: "Build AAX plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "aax", "--output", "projects/macos/aax.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PLUGIN_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
