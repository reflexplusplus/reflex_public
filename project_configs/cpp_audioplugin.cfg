@Template cpp_audioplugin_audiounit:
{
	inherit: cpp_audioplugin;
	extension: "component";
	dependencies: [ReflexCommon, ReflexCommonUi, ReflexTargetAU];

	@macos:
	{
		exported_symbols: "$(REFLEX_PATH)/resources/macos/audiounit_exports.txt";
		bundle_identifier: "$(PLUGIN_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/audiounit.plist";
