include: "common_app.cfg";

@Template cpp_audioplugin:
{
	inherit: common_app;

	type: dynamic_library;
	output_name: "$[strip:$(PRODUCT_NAME)]";
	output_directory: "$(OUTPUT_PATH)/$(Platform)/$(Configuration)/$(OutputName)/$(TargetName)";
	@Variables defines:
	{
		REFLEX_BOOTSTRAP_TYPE_AUDIOPLUGIN: "";
		PRODUCT_PACKAGE_IDENTIFIER: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		PRODUCT_VERSION: "$(PRODUCT_VERSION)";
		AU_COMPONENTS: "$(AU_COMPONENTS)";
		AU_VENDOR_4CC: "$(AU_VENDOR_4CC)";
	};
	floating_point: fast;

	@Variables:
	{
		CONFIGURATION_LOWER: "$[lowercase:$(Configuration)]";
		PLUGIN_PACKAGE_IDENTIFIER: "$(PRODUCT_PACKAGE_IDENTIFIER).$[package_identifier_segment:$(Extension)]";
	};

	@windows:
	{
		output_directory: "$(OUTPUT_PATH)/windows/$(Configuration)/$(Architecture)/$(OutputName)/$(TargetName)";
		resources: "$[get_reflex_path:]/resources/win/reflex_system.res";
	};

	@macos:
	{
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		entitlements: "platform_assets/macos/HardenedRT.entitlements";
		frameworks: "AudioToolbox", "AudioUnit", "Cocoa", "CoreAudio", "CoreMIDI", "DiskArbitration", "Metal", "QuartzCore";
	};

	@ios:
	{
		output_directory: "$(OUTPUT_PATH)/ios/$(Configuration)-$(PlatformVariant)/$(OutputName)/$(TargetName)";
		icon: "platform_assets/ios/Assets.xcassets";
		launch_screen: "platform_assets/ios/Base.lproj/LaunchScreen.storyboard";
		frameworks: "AudioToolbox", "AVFoundation", "CoreMIDI", "Foundation", "Metal", "QuartzCore", "UIKit", "UniformTypeIdentifiers";
	};

	@android:
	{
		assets: "platform_assets/android";
	};

	@linux: { enabled: false; };
};

@Template cpp_audioplugin_app:
{
	inherit: cpp_audioplugin;
	type: app;
	dependencies: ReflexCommon, ReflexCommonUi, ReflexTargetAudioApp;

	@Variables: { PLUGIN_PACKAGE_IDENTIFIER: "$(PRODUCT_PACKAGE_IDENTIFIER)"; };

	@windows:
	{
		resources: ["$[get_reflex_path:]/resources/win/reflex_system.res", "platform_assets/windows/icon.rc"];
	};

	@macos:
	{
		extension: "app";
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/standalone.plist";
		icon: "platform_assets/macos/Assets.xcassets";
		@BuildStep post_generate:
		{
			name: "Build Standalone plist";
			command: ["$[get_reflex_cli_path:]", "build-plist", "--target", "audioapp", "--output", "projects/macos/standalone.plist", "--product", "$(PRODUCT_NAME)", "--bundle_id", "$(PRODUCT_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@ios:
	{
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		info_plist: "projects/ios/Info.plist";
		@BuildStep post_generate:
		{
			name: "Build iOS plist";
			command: ["$[get_reflex_cli_path:]", "build-plist", "--target", "ios_audioapp", "--output", "projects/ios/Info.plist", "--product", "$(PRODUCT_NAME)", "--bundle_id", "$(PRODUCT_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@android: 
	{ 
		package_id: "$(PRODUCT_PACKAGE_IDENTIFIER)"; 
	};
};

@Template cpp_audioplugin_clap:
{
	inherit: cpp_audioplugin;
	extension: "clap";
	dependencies: ReflexCommon, ReflexCommonUi, ReflexTargetCLAP;

	@macos:
	{
		exported_symbols: "$(REFLEX_PATH)/resources/macos/clap_exports.txt";
		bundle_identifier: "$(PLUGIN_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/clap.plist";
		@BuildStep post_generate:
		{
			name: "Build CLAP plist";
			command: ["$[get_reflex_cli_path:]", "build-plist", "--target", "clap", "--output", "projects/macos/clap.plist", "--product", "$(PRODUCT_NAME)", "--bundle_id", "$(PLUGIN_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@ios: { enabled: false; };
	@android: { enabled: false; };
};

