include: "common_app.cfg";

@Template cpp_audioplugin:
{
	inherit: common_app;

	type: dynamic_library;
	output_name: "$[strip:$(PRODUCT_NAME)]";
	output_directory: "$(OUTPUT_PATH)/$(Platform)/$(Configuration)/$(OutputName)/$(TargetName)";
	@Variables defines:
	{
		REFLEX_BOOTSTRAP_TYPE_AUDIOPLUGIN: "";
		PRODUCT_PACKAGE_IDENTIFIER: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		PRODUCT_VERSION: "$(PRODUCT_VERSION)";
		AU_COMPONENTS: "$(AU_COMPONENTS)";
		AU_VENDOR_4CC: "$(AU_VENDOR_4CC)";
	};
	floating_point: fast;

	@Variables:
	{
		CONFIGURATION_LOWER: "$[lowercase:$(Configuration)]";
		PLUGIN_PACKAGE_IDENTIFIER: "$(PRODUCT_PACKAGE_IDENTIFIER).$[package_identifier_segment:$(Extension)]";
	};

	@windows:
	{
		output_directory: "$(OUTPUT_PATH)/windows/$(Configuration)/$(Architecture)/$(OutputName)/$(TargetName)";
		resources: "$(REFLEX_PATH)/resources/win/reflex_system.res";
	};

	@macos:
	{
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		entitlements: "platform_assets/macos/HardenedRT.entitlements";
		frameworks: "Metal", "QuartzCore", "AudioToolbox", "AudioUnit", "CoreAudio", "CoreMIDI";
	};

	@ios:
	{
		output_directory: "$(OUTPUT_PATH)/ios/$(Configuration)-$(PlatformVariant)/$(OutputName)/$(TargetName)";
		icon: "platform_assets/ios/Assets.xcassets";
		launch_screen: "platform_assets/ios/Base.lproj/LaunchScreen.storyboard";
		frameworks: "AudioToolbox", "AVFoundation", "CoreMIDI";
	};

	@android:
	{
		main_source_set: "platform_assets/android/main";
	};

	@web: { enabled: false; };
};

@Template cpp_audioplugin_app:
{
	inherit: cpp_audioplugin, macos_release_codesign;
	type: app;
	dependencies: ReflexCommon, ReflexCommonUi, ReflexTargetAudioApp;

	@Variables: { PLUGIN_PACKAGE_IDENTIFIER: "$(PRODUCT_PACKAGE_IDENTIFIER)"; };

	@linux:
	{
		icon: "platform_assets/linux/icon/";
		package_id: "$(PRODUCT_PACKAGE_IDENTIFIER)";
	};

	@windows:
	{
		resources: ["$(REFLEX_PATH)/resources/win/reflex_system.res", "platform_assets/windows/icon.rc"];
	};

	@macos:
	{
		extension: "app";
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/standalone.plist";
		icon: "platform_assets/macos/Assets.xcassets";
		@BuildStep post_generate:
		{
			name: "Build Standalone plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "audioapp", "--output", "projects/macos/standalone.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PRODUCT_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@ios:
	{
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		info_plist: "projects/ios/Info.plist";
		@BuildStep post_generate:
		{
			name: "Build iOS plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "ios_audioapp", "--output", "projects/ios/Info.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PRODUCT_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@android: 
	{ 
		package_id: "$(PRODUCT_PACKAGE_IDENTIFIER)"; 
	};

	@web:
	{
		enabled: true;
		entry_page: "platform_assets/web/index.html";
	};
};

@Template cpp_audioplugin_clap:
{
	inherit: cpp_audioplugin, macos_release_codesign;
	extension: "clap";
	dependencies: ReflexCommon, ReflexCommonUi, ReflexTargetCLAP;

	@macos:
	{
		exported_symbols: "$(REFLEX_PATH)/resources/macos/clap_exports.txt";
		bundle_identifier: "$(PLUGIN_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/clap.plist";
		@BuildStep post_generate:
		{
			name: "Build CLAP plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "clap", "--output", "projects/macos/clap.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PLUGIN_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@ios: { enabled: false; };
	@android: { enabled: false; };
};

#if (VST2API_PATH)
{
	@Template cpp_audioplugin_vst2:
	{
		inherit: cpp_audioplugin, macos_release_codesign;
		dependencies: [ReflexCommon, ReflexCommonUi, ReflexTargetVST2];

		@linux: { extension: "so"; };

		@macos:
		{
			extension: "vst";
			exported_symbols: "$(REFLEX_PATH)/resources/macos/VST2_exports.txt";
			bundle_identifier: "$(PLUGIN_PACKAGE_IDENTIFIER)";
			info_plist: "projects/macos/vst2.plist";
			@BuildStep post_generate:
			{
				name: "Build VST2 plist";
				command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "vst2", "--output", "projects/macos/vst2.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PLUGIN_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
			};
		};

		@ios: { enabled: false; };
		@android: { enabled: false; };
	};
}

@Template cpp_audioplugin_vst3:
{
	inherit: cpp_audioplugin, macos_release_codesign;
	extension: "vst3";
	dependencies: [ReflexCommon, ReflexCommonUi, ReflexTargetVST3];

	@linux:
	{
		architectures: x64;
		extension: "so";
		output_directory: "$(OUTPUT_PATH)/linux/$(Configuration)/$(OutputName)/$(TargetName)/$(OutputName).vst3/Contents/x86_64-linux";
	};

	@macos:
	{
		exported_symbols: "$(REFLEX_PATH)/resources/macos/VST3_exports.txt";
		bundle_identifier: "$(PLUGIN_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/vst3.plist";
		@BuildStep post_generate:
		{
			name: "Build VST3 plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "vst3", "--output", "projects/macos/vst3.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PLUGIN_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@ios: { enabled: false; };
	@android: { enabled: false; };
};

@Template cpp_audioplugin_audiounit:
{
	inherit: cpp_audioplugin, macos_release_codesign;
	extension: "component";
	dependencies: [ReflexCommon, ReflexCommonUi, ReflexTargetAU];

	@macos:
	{
		exported_symbols: "$(REFLEX_PATH)/resources/macos/audiounit_exports.txt";
		bundle_identifier: "$(PLUGIN_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/audiounit.plist";
		@BuildStep post_generate:
		{
			name: "Build Audio Unit plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "au", "--output", "projects/macos/audiounit.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PLUGIN_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)", "--vendor", "$(VENDOR_NAME)", "--au_components", "$(AU_COMPONENTS)", "--au_manufacturer", "$(AU_VENDOR_4CC)"];
		};
	};

	@windows: { enabled: false; };
	@ios: { enabled: false; };
	@android: { enabled: false; };
	@linux: { enabled: false; };
};

@Template cpp_audioplugin_aax:
{
	inherit: cpp_audioplugin;
	@linux: { enabled: false; };
	extension: "aaxplugin";
	dependencies: [ReflexCommon, ReflexCommonUi, ReflexTargetAAX];

	// Set the root of your Avid AAX SDK (2.9 or later) with `reflex set AAX_SDK_PATH <path>`.
	@Variables:
	{
		PLUGIN_PACKAGE_IDENTIFIER: "$(PRODUCT_PACKAGE_IDENTIFIER).aax";
		AAX_SDK_PATH: "";
	};
	@Variables defines: { ACFPLUGIN_EXPORTS: ""; };
	include_directories: ["$(AAX_SDK_PATH)/Interfaces", "$(AAX_SDK_PATH)/Interfaces/ACF"];

	// AAX_Exports.cpp plus AAXLibrary_SOURCES from Libs/AAXLibrary/CMakeLists.txt,
	// minus the unused AAX_CAutoreleasePool files.
	@Files sources:
	{
		aax_sdk:
		"$(AAX_SDK_PATH)/Interfaces/AAX_Exports.cpp",
		"$(AAX_SDK_PATH)/Interfaces/ACF/CACFClassFactory.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CACFUnknown.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CChunkDataParser.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CEffectDirectData.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CEffectGUI.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CEffectParameters.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CHostProcessor.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CHostServices.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CMutex.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CommonConversions.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CPacketDispatcher.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CParameter.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CParameterManager.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CString.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CTask.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CTaskAgent.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_CUIDs.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_IEffectDirectData.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_IEffectGUI.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_IEffectParameters.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_IHostProcessor.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_ITaskAgent.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_Init.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_Properties.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_SliderConversions.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VAutomationDelegate.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VCollection.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VComponentDescriptor.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VController.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VDescriptionHost.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VEffectDescriptor.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VFeatureInfo.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VHostProcessorDelegate.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VHostServices.cpp",
		"$(AAX_SDK_PATH)/Libs/AAXLibrary/source/AAX_VHostTaskAgent.cpp",
