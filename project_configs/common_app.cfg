@Variables:
{
	APPLE_DEVELOPMENT_TEAM: "";
	ANDROID_SIGNING_PROPERTIES: "";
};

#if (reflex_source)
{
	include: "common.cfg", "$[get_reflex_path:]/build/lib/project.cfg";
}
#else
{
	include: "common.cfg";

	@Library 'oboe::oboe':
	{
		inherit: reflex_common;
		@windows: { enabled: false; };
		@macos: { enabled: false; };
		@ios: { enabled: false; };
		@linux: { enabled: false; };
	};

	// Installed SDK builds link the prebuilt Reflex products.
	@Template reflex_library:
	{
		inherit: reflex_common;

		@windows:
		{
			path: "$(REFLEX_PATH)/bin/lib/win/$(Configuration)/$(Architecture)/$(TargetName).lib";
		};

		@macos:
		{
			path: "$(REFLEX_PATH)/bin/lib/macos/$(Configuration)/lib$(TargetName).a";
		};

		@ios:
		{
			path: "$(REFLEX_PATH)/bin/lib/ios/$(Configuration)-$(PlatformVariant)/lib$(TargetName).a";
		};

		@android:
		{
			path: "$(REFLEX_PATH)/bin/lib/android/$(CONFIGURATION_LOWER)/lib$(TargetName).a";
		};

		@linux:
		{
			path: "$(REFLEX_PATH)/bin/lib/linux/$(Configuration)/lib$(TargetName).a";
		};
	};

	@Library ReflexCommon: { inherit: reflex_library; cmake_identifier: "Reflex::Common"; };
	@Library ReflexCommonUi: { inherit: reflex_library; cmake_identifier: "Reflex::CommonUi"; };
	@Library ReflexCommonVm: { inherit: reflex_library; cmake_identifier: "Reflex::Vm"; };
	@Library ReflexTargetApp:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetApp";
		@android: { dependencies: ['oboe::oboe']; };
	};

	@Library ReflexSystemOpenGL:
	{
		inherit: reflex_library;
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetAudioApp:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetAudioApp";
		@android: { dependencies: ['oboe::oboe']; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetAudioAppASIO:
	{
		inherit: reflex_library;
		@macos: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetCLAP:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetCLAP";
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetConsole:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetConsole";
		@ios: { enabled: false; };
		@android: { enabled: false; };
	};

	@Library ReflexTargetDynamicLibrary:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetDynamicLibrary";
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetLibrary:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetLibrary";
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetVST2:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetVST2";
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetVST3:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetVST3";
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};

	@Library ReflexTargetAU:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetAU";
		@windows: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};
}

@Template common_app:
{
	inherit: reflex_common;

	// Select how generated CMake projects acquire Reflex. Source builds consume
	// the targets exposed by build/lib/project.cfg; SDK builds find the package.
	#if (reflex_source)
	{
		@Variables cmake_variables:
		{
			REFLEX_ROOT: "$(REFLEX_PATH)";
		};
		cmake_includes: "$(REFLEX_PATH)/cmake/ReflexBuild.cmake";
	}
	#else
	{
		@Variables cmake_find_packages:
		{
			Reflex: "CONFIG REQUIRED";
		};
	}

	@BuildStep post_generate:
	{
		name: "Build Resources";
		command: ["$[get_reflex_cli_path:]", "build-resources", "--path", "resources.xml"];
	};

	@BuildStep pre_build:
	{
		name: "Build Resources";
		command: ["$[path:$(REFLEX_CLI_PATH)]", "build-resources", "--path", "resources.xml"];
		inputs: "resources.xml";
	};

	@windows:
	{
		intermediate_directory: "projects/windows/vcxproj/$(Configuration)/$(Architecture)/$(TargetName)";
	};

	@macos:
	{
		development_team: "$(APPLE_DEVELOPMENT_TEAM)";
	};

	@ios:
	{
		deployment_target: 14.0;
		development_team: "$(APPLE_DEVELOPMENT_TEAM)";
	};

	@android:
	{
		@Configuration Release:
		{
			signing_properties: "$(ANDROID_SIGNING_PROPERTIES)";
		};

		gradle_dependencies:
		"androidx.core:core-ktx:1.18.0",
		"androidx.appcompat:appcompat:1.7.1",
		"com.google.android.material:material:1.13.0",
		"com.google.oboe:oboe:1.10.0",
		"$(REFLEX_PATH)/bin/lib/android/$(CONFIGURATION_LOWER)/reflex.aar";
	};
};
