@Variables:
{
	APPLE_DEVELOPMENT_TEAM: "";
	ANDROID_SIGNING_PROPERTIES: "";
};

#if (reflex_source)
{
	include: "common.cfg", "$(REFLEX_PATH)/build/lib/project.cfg";
}
#else
{
	include: "common.cfg";

	@Library 'oboe::oboe':
	{
		inherit: reflex_common;

		@linux: { enabled: false; };
		@windows: { enabled: false; };
		@macos: { enabled: false; };
		@ios: { enabled: false; };
		@web: { enabled: false; };
	};

	// Installed SDK builds link the prebuilt Reflex products.
	@Template reflex_library:
	{
		inherit: [reflex_common, reflex_linux_dependencies];
		source_project: "$(REFLEX_PATH)/build/lib/project.cfg";

		@linux:
		{
			path: "$(REFLEX_PATH)/bin/lib/linux/$(Configuration)/lib$(TargetName).a";
		};

		@windows:
		{
			path: "$(REFLEX_PATH)/bin/lib/win/$(Configuration)/$(Architecture)/$(TargetName).lib";
		};

		@macos:
		{
			path: "$(REFLEX_PATH)/bin/lib/macos/$(Configuration)/lib$(TargetName).a";
		};

		@ios:
		{
			path: "$(REFLEX_PATH)/bin/lib/ios/$(Configuration)-$(PlatformVariant)/lib$(TargetName).a";
		};

		@android:
		{
			path: "$(REFLEX_PATH)/bin/lib/android/$(CONFIGURATION_LOWER)/$(Architecture)/lib$(TargetName).a";
		};

		@web: 
		{ 
			path: "$(REFLEX_PATH)/bin/lib/web/$(Configuration)/lib$(TargetName).a"; 
		};
	};

	@Library ReflexCommon: { inherit: reflex_library; cmake_identifier: "Reflex::Common"; };
	@Library ReflexCommonUi: { inherit: reflex_library; cmake_identifier: "Reflex::CommonUi"; };
	@Library ReflexCommonVm: { inherit: reflex_library; cmake_identifier: "Reflex::Vm"; };
	@Library ReflexTargetApp:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies];
		cmake_identifier: "Reflex::TargetApp";

		@android: { dependencies: ['oboe::oboe']; };
	};

	@Library ReflexSystemOpenGL:
	{
		inherit: reflex_library;

		@linux: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetAudioApp:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies, reflex_linux_audio_dependencies];
		cmake_identifier: "Reflex::TargetAudioApp";

		@android: { dependencies: ['oboe::oboe']; };
	};

	@Library ReflexTargetAudioAppASIO:
	{
		inherit: reflex_library;

		@linux: { enabled: false; };
		@macos: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetCLAP:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies];
		cmake_identifier: "Reflex::TargetCLAP";

		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetConsole:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetConsole";

		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetDynamicLibrary:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetDynamicLibrary";

		@linux: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetLibrary:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetLibrary";

		@linux: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetVST2:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies];
		cmake_identifier: "Reflex::TargetVST2";

		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetVST3:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies];
		cmake_identifier: "Reflex::TargetVST3";

		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetAU:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetAU";

		@linux: { enabled: false; };
		@windows: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetAAX:
	{
		@web: { enabled: false; };
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetAAX";
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@linux: { enabled: false; };
	};
}

@Template common_app:
{
	inherit: reflex_common;

	// Select how generated CMake projects acquire Reflex. Both find the package:
	// source builds point it at the checkout, SDK builds at the installed package.
	// ReflexConfig.cmake carries the platform machinery (pkg-config imported
	// targets, wayland protocol generation, from-source target resolution) that
	// ReflexBuild.cmake alone does not provide.
	#if (reflex_source)
	{
		@Variables cmake_variables:
		{
			REFLEX_ROOT: "$(REFLEX_PATH)";
		};
		@Variables cmake_find_packages:
		{
			// NO_CMAKE_FIND_ROOT_PATH: iOS sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY,
			// which re-roots PATHS onto the SDK sysroot and never searches the checkout.
			Reflex: "CONFIG REQUIRED PATHS ${REFLEX_ROOT}/cmake NO_DEFAULT_PATH NO_CMAKE_FIND_ROOT_PATH";
		};
	}
	#else
	{
		@Variables cmake_find_packages:
		{
			Reflex: "CONFIG REQUIRED";
		};
	}

	@BuildStep post_generate:
	{
		name: "Build Resources";
		command: ["$(REFLEX_CLI_PATH)", "build-resources", "--path", "resources.xml"];
	};

	@BuildStep pre_build:
	{
		name: "Build Resources";
		command: ["$[path:$(REFLEX_CLI_PATH)]", "build-resources", "--path", "resources.xml"];
		inputs: "resources.xml";
	};

	@macos:
	{
		frameworks: "Cocoa", "DiskArbitration", "Network", "Security";
		development_team: "$(APPLE_DEVELOPMENT_TEAM)";
	};

	@ios:
	{
		frameworks: "Foundation", "Metal", "QuartzCore", "UIKit", "UniformTypeIdentifiers", "Network", "Security";
		deployment_target: 14.0;
		development_team: "$(APPLE_DEVELOPMENT_TEAM)";
	};

	@android:
	{
		@Configuration Release:
		{
			signing_properties: "$(ANDROID_SIGNING_PROPERTIES)";
		};

		gradle_dependencies:
		"androidx.core:core-ktx:1.18.0",
		"androidx.appcompat:appcompat:1.7.1",
		"com.google.android.material:material:1.13.0",
		"com.google.oboe:oboe:1.10.0";

		main_source_set: "$(REFLEX_PATH)/resources/android";
	};
};
