include: "common_app.cfg";

// Console product settings without resource-build automation. Stage-zero tools
// such as ReflexCLI can inherit this without creating a dependency on the CLI.
@Template cpp_console:
{
	inherit: reflex_common;

	type: console;
	output_name: "$[strip:$(PRODUCT_NAME)]";
	output_directory: "$(OUTPUT_PATH)/$(Platform)/$(Configuration)/$(Architecture)/$(TargetName)";
	dependencies: [ReflexCommon, ReflexTargetConsole];
	@Variables defines: { REFLEX_BOOTSTRAP_TYPE_CONSOLE_APP: ""; };

	@windows:
	{
		@Configuration Release: { optimization: size; };
	};

	@macos:
	{
		output_directory: "$(OUTPUT_PATH)/$(Platform)/$(Configuration)/$(TargetName)";
		frameworks: ["Cocoa", "DiskArbitration"];
		@Configuration Release: { optimization: size; };
	};

	@linux:
	{
		intermediate_directory: "projects/linux/obj/$(Configuration)/$(Architecture)/$(TargetName)";
		@Configuration Release: { optimization: size; };
	};

	@ios: { enabled: false; };
	@android: { enabled: false; };
};

// Normal console applications retain the shared application defaults and
// resource build steps supplied by common_app.
@Template cpp_console_app:
{
	inherit: [common_app, cpp_console];
};
