include: "cpp_app.cfg";

@Template vm_app:
{
	inherit: cpp_app;

	// Replace the standard application bootstrap define while preserving the
	// project-version define supplied by cpp_app.
	@Unset defines;
	@Variables defines:
	{
		REFLEX_BOOTSTRAP_TYPE_VM_APP: "";
		PRODUCT_VERSION: "$(PRODUCT_VERSION)";
	};

	dependencies: ReflexCommonVm;
};
