include: "common_app.cfg";

@Template cpp_app:
{
	inherit: common_app, macos_release_codesign;

	type: app;
	output_name: "$[strip:$(PRODUCT_NAME)]";
	output_directory: "$(OUTPUT_PATH)/$(Platform)/$(Configuration)/$(OutputName)";
	dependencies: [ReflexCommon, ReflexCommonUi, ReflexTargetApp];
	@Variables:
	{
		PRODUCT_PACKAGE_IDENTIFIER: "com.$[package_identifier_segment:$(VENDOR_NAME)].$[package_identifier_segment:$(PRODUCT_NAME)]";
	};
	@Variables defines:
	{
		REFLEX_BOOTSTRAP_TYPE_APP: "";
		PRODUCT_VERSION: "$(PRODUCT_VERSION)";
	};

	@linux:
	{
		icon: "platform_assets/linux/icon/";
		package_id: "$(PRODUCT_PACKAGE_IDENTIFIER)";
	};

	@windows:
	{
		output_directory: "$(OUTPUT_PATH)/windows/$(Configuration)/$(Architecture)/$(OutputName)";
		resources:
		[
			"$(REFLEX_PATH)/resources/win/reflex_system.res",
			"platform_assets/windows/icon.rc"
		];
	};

	@macos:
	{
		extension: "app";
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		info_plist: "projects/macos/App.plist";
		entitlements: "platform_assets/macos/HardenedRT.entitlements";
		icon: "platform_assets/macos/Assets.xcassets";
		frameworks: "Metal", "QuartzCore";
		@BuildStep post_generate:
		{
			name: "Build macOS plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "app", "--output", "projects/macos/App.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PRODUCT_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@ios:
	{
		output_directory: "$(OUTPUT_PATH)/ios/$(Configuration)-$(PlatformVariant)/$(OutputName)";
		bundle_identifier: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		info_plist: "projects/ios/Info.plist";
		icon: "platform_assets/ios/Assets.xcassets";
		launch_screen: "platform_assets/ios/Base.lproj/LaunchScreen.storyboard";
		@BuildStep post_generate:
		{
			name: "Build iOS plist";
			command: ["$(REFLEX_CLI_PATH)", "build-plist", "--target", "ios_app", "--output", "projects/ios/Info.plist", "--product", "$(PRODUCT_NAME)", "--executable", "$(OutputName)", "--bundle_id", "$(PRODUCT_PACKAGE_IDENTIFIER)", "--version", "$(PRODUCT_VERSION)"];
		};
	};

	@android:
	{
		package_id: "$(PRODUCT_PACKAGE_IDENTIFIER)";
		main_source_set: "platform_assets/android/main";
	};

	@web:
	{
		entry_page: "platform_assets/web/index.html";
	};
};
