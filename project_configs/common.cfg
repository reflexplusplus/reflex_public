// Project-wide defaults and variables shared by every generated target,
// including the Reflex libraries themselves.

format: 1;

default_configuration: Release;

@Variables:
{
	REFLEX_PATH: "$[get_reflex_path:]";
	REFLEX_CLI_PATH: "$[get_reflex_cli_path:]";
	OUTPUT_PATH: "output";
	ANDROID_SDK_PATH: "";
	CONFIGURATION_LOWER: "$[lowercase:$(Configuration)]";
};

// Base settings shared by compiled Reflex targets. Platform drivers make the
// complete supported shape explicit and provide the Debug/Release defaults
// inherited by concrete targets.
@Template reflex_common:
{
	cpp_standard: cxx20;
	rtti: false;
	runtime_library: static;
	include_directories: "$(REFLEX_PATH)/include";
	warning_level: standard;

	@windows:
	{
		architectures: x64;
		sdk: "10.0";

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
		};
	};

	@macos:
	{
		architectures: [arm64, x64];
		arc: false;
		deployment_target: 10.15;

		// Reflex does not require RTTI, but Clang can fail when linking an
		// RTTI-disabled library into an RTTI-enabled desktop project.
		rtti: true;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
			build_all_architectures: false;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
			build_all_architectures: true;
		};
	};

	@ios:
	{
		architectures: arm64;
		arc: true;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
		};
	};

	@android:
	{
		architectures: arm64, x64;	//x86 removed to speed up builds
		runtime_library: dynamic;
		sdk_path: "$(ANDROID_SDK_PATH)";
		sdk: 37;
		min_sdk: 28;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			architectures: arm64;
			debug_information: false;
			optimization: full;
		};
	};

	@linux:
	{
		architectures: x64;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
		};
	};
};
