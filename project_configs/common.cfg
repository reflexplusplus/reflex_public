// Project-wide defaults and variables shared by every generated target,
// including the Reflex libraries themselves.

format: 1;

default_configuration: Release;

@Variables:
{
	REFLEX_PATH: "$[get_reflex_path:]";
	REFLEX_CLI_PATH: "$[get_reflex_cli_path:]";
	OUTPUT_PATH: "output";
	ANDROID_SDK_PATH: "";
	CONFIGURATION_LOWER: "$[lowercase:$(Configuration)]";
};

// Base settings shared by compiled Reflex targets. Platform drivers make the
// complete supported shape explicit and provide the Debug/Release defaults
// inherited by concrete targets.
@Template reflex_common:
{
	cpp_standard: cxx20;
	rtti: false;
	runtime_library: static;
	public_include_directories: "$(REFLEX_PATH)/include";
	warning_level: standard;

	@linux:
	{
		architectures: x64;
		// GCC diagnoses Reflex's public nested aliases unless permissive mode is enabled.
		compiler_options: "-fpermissive";

		// Keep typeinfo available when linking into RTTI-enabled desktop projects.
		rtti: true;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
		};
	};

	@windows:
	{
		#if (reflex_32bit)
		{
			architectures: [x86, x64];
		}
		#else
		{
			architectures: x64;
		}
		
		sdk: "10.0";

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
			dead_strip: true;
		};
	};

	@macos:
	{
		architectures: [arm64, x64];
		arc: false;
		deployment_target: 10.15; // the libraries' floor: apps can target a later macOS, never an earlier one

		// Reflex does not require RTTI, but Clang can fail when linking an
		// RTTI-disabled library into an RTTI-enabled desktop project.
		rtti: true;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
			build_all_architectures: false;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
			build_all_architectures: true;
		};
	};

	@ios:
	{
		architectures: arm64;
		arc: true;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			debug_information: false;
			optimization: full;
		};
	};

	@android:
	{
		architectures: arm64, x64;	//x86 removed to speed up builds
		runtime_library: dynamic;
		sdk_path: "$(ANDROID_SDK_PATH)";
		sdk: 37;
		min_sdk: 28;

		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
		};

		@Configuration Release:
		{
			architectures: arm64;
			debug_information: false;
			optimization: full;
		};
	};

	@web:
	{
		architectures: native; // wasm32 is selected by the web toolchain.
		@Configuration Debug:
		{
			debug_information: true;
			optimization: none;
			@Variables defines: { _DEBUG: ""; };
		};
		@Configuration Release: { debug_information: false; optimization: full; };
	};
};

// Linux system packages are needed by both source builds and consumers of the
// prebuilt archives. Keep their metadata shared for build and editor generation.
@Template reflex_linux_dependencies:
{
	@linux: { pkg_config: "libcurl"; };
};

@Template reflex_linux_ui_dependencies:
{
	@linux:
	{
		pkg_config:
		[
			"egl", "glesv2", "x11", "x11-xcb", "xcb", "xcb-icccm",
			"xcb-cursor", "xcb-randr", "xcb-xkb", "xcb-xtest", "xcb-sync",
			"xkbcommon", "xkbcommon-x11", "dbus-1"
		];
	};
};

@Template reflex_linux_audio_dependencies:
{
	@linux: { pkg_config: "alsa"; };
};
