// Reflex library dependencies for source and prebuilt consumers.
// reflex_source selects source targets; prebuilt libraries retain source_project build support.

#if (reflex_source)
{
	include: "project_configs/common.cfg", "project.cfg";
}
#else
{
	include: "project_configs/common.cfg";

	@Library 'oboe::oboe':
	{
		inherit: reflex_common;

		@linux: { enabled: false; };
		@windows: { enabled: false; };
		@macos: { enabled: false; };
		@ios: { enabled: false; };
		@web: { enabled: false; };
	};

	// Installed SDK builds link the prebuilt Reflex products.
	@Template reflex_library:
	{
		inherit: [reflex_common, reflex_linux_dependencies];
		source_project: "$(REFLEX_PATH)/project.cfg";

		@linux:
		{
			path: "$(REFLEX_PATH)/bin/lib/linux/$(Configuration)/lib$(TargetName).a";
		};

		@windows:
		{
			path: "$(REFLEX_PATH)/bin/lib/win/$(Configuration)/$(Architecture)/$(TargetName).lib";
		};

		@macos:
		{
			path: "$(REFLEX_PATH)/bin/lib/macos/$(Configuration)/lib$(TargetName).a";
		};

		@ios:
		{
			path: "$(REFLEX_PATH)/bin/lib/ios/$(Configuration)-$(PlatformVariant)/lib$(TargetName).a";
		};

		@android:
		{
			path: "$(REFLEX_PATH)/bin/lib/android/$(CONFIGURATION_LOWER)/$(Architecture)/lib$(TargetName).a";
		};

		@web:
		{
			path: "$(REFLEX_PATH)/bin/lib/web/$(Configuration)/lib$(TargetName).a";
		};
	};

	@Library ReflexCommon: { inherit: reflex_library; cmake_identifier: "Reflex::Common"; };
	@Library ReflexCommonUi: { inherit: reflex_library; cmake_identifier: "Reflex::CommonUi"; };
	@Library ReflexCommonVm: { inherit: reflex_library; cmake_identifier: "Reflex::Vm"; };
	@Library ReflexTargetApp:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies];
		cmake_identifier: "Reflex::TargetApp";

		@android: { dependencies: ['oboe::oboe']; };
	};

	@Library ReflexSystemOpenGL:
	{
		inherit: reflex_library;

		@linux: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetAudioApp:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies, reflex_linux_audio_dependencies];
		cmake_identifier: "Reflex::TargetAudioApp";

		@android: { dependencies: ['oboe::oboe']; };
	};

	@Library ReflexTargetAudioAppASIO:
	{
		inherit: reflex_library;

		@linux: { enabled: false; };
		@macos: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetCLAP:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies];
		cmake_identifier: "Reflex::TargetCLAP";

		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetConsole:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetConsole";

		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetDynamicLibrary:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetDynamicLibrary";

		@linux: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetLibrary:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetLibrary";

		@linux: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	#if (VST2API_PATH)
	{
		@Library ReflexTargetVST2:
		{
			inherit: [reflex_library, reflex_linux_ui_dependencies];
			cmake_identifier: "Reflex::TargetVST2";

			@ios: { enabled: false; };
			@android: { enabled: false; };
			@web: { enabled: false; };
		};
	}

	@Library ReflexTargetVST3:
	{
		inherit: [reflex_library, reflex_linux_ui_dependencies];
		cmake_identifier: "Reflex::TargetVST3";

		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	@Library ReflexTargetAU:
	{
		inherit: reflex_library;
		cmake_identifier: "Reflex::TargetAU";

		@linux: { enabled: false; };
		@windows: { enabled: false; };
		@ios: { enabled: false; };
		@android: { enabled: false; };
		@web: { enabled: false; };
	};

	#if (AAX_SDK_PATH)
	{
		@Library ReflexTargetAAX:
		{
			@web: { enabled: false; };
			inherit: reflex_library;
			cmake_identifier: "Reflex::TargetAAX";
			@ios: { enabled: false; };
			@android: { enabled: false; };
			@linux: { enabled: false; };
		};
	}
}
